<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ISHYA Legacy | The Hall of Fame</title>

    <link rel="shortcut icon" type="image/x-icon" href="../Logo Ishya.ico" />
    <link rel="stylesheet" href="/global.css" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Foldit:wght@400;600;800;900&family=Syncopate:wght@400;700&family=Space+Grotesk:wght@300;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <script src="../layout.js" defer></script>

    <style>
        :root {
            --bg-dark: #051408;
            --accent-gold: #D6C26A;
            --accent-olive: #6B7540;
            --accent-green: #4D8F48;
            --text-light: #e0e0e0;
            --font-display: 'Syncopate', sans-serif;
            --font-fold: 'Foldit', display;
            --font-body: 'Space Grotesk', sans-serif;
            --font-tech: 'Share Tech Mono', monospace;
            --header-h: 75px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: transparent; color: var(--text-light);
            font-family: var(--font-body); overflow-x: hidden;
            width: 100vw; min-height: 100vh;
        }

        #animated-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -10;
            background-color: var(--bg-dark); pointer-events: none;
        }

        #bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(5, 20, 8, 0.95) 100%);
            z-index: -5; pointer-events: none;
        }

        /* --- Header Styles --- */
        .page-header {
            position: relative; width: 100%; z-index: 10; display: flex; 
            align-items: center; justify-content: center; padding: 40px 20px 10px 20px;
        }
        .brand {
            font-size: 2.5rem; font-weight: 700; color: var(--accent-gold); 
            letter-spacing: 2px; text-transform: uppercase; text-align: center; line-height: 1.2;
        }
        .brand span {
            color: var(--accent-green); font-size: 1.1rem; display: block; 
            letter-spacing: 6px; margin-top: 5px; font-family: var(--font-display);
        }

        /* --- Layout Styles --- */
        section {
            padding: 20px 5vw 80px 5vw; display: flex; flex-direction: column;
            align-items: center; z-index: 10; position: relative;
        }

        .intro-text {
            text-align: center; max-width: 700px; margin-bottom: 40px;
            font-size: 1.1rem; line-height: 1.6; color: rgba(240,240,240,0.8);
        }

        /* --- Tabs Styles --- */
        .tabs {
            display: flex; gap: 20px; margin-bottom: 50px; flex-wrap: wrap; justify-content: center;
        }

        .tab-btn {
            background: rgba(15, 23, 42, 0.6); color: var(--text-light);
            border: 1px solid rgba(148, 163, 184, 0.4); padding: 12px 32px; 
            border-radius: 8px; font-family: var(--font-display); font-size: 1rem; 
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
            transition: all 0.3s ease; font-weight: bold; backdrop-filter: blur(5px);
        }

        .tab-btn:hover {
            border-color: var(--accent-green); box-shadow: 0 0 15px rgba(77, 143, 72, 0.3);
        }

        .tab-btn.active {
            background: var(--accent-gold); color: var(--bg-dark);
            border-color: var(--accent-gold); box-shadow: 0 0 20px rgba(214, 194, 106, 0.4);
        }

        /* --- Grid & Card Styles --- */
        .legacy-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px; width: 100%; max-width: 1300px; opacity: 1; transition: opacity 0.4s ease;
        }
        
        .legacy-grid.fade-out { opacity: 0; }

        .committee-card {
            border-radius: 16px; border: 1px solid rgba(148, 163, 184, 0.2);
            background: radial-gradient(circle at top left, rgba(148, 163, 184, 0.08), rgba(5, 10, 8, 0.8));
            padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .committee-card:hover {
            transform: translateY(-5px); border-color: rgba(77, 143, 72, 0.5);
            box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 20px rgba(77, 143, 72, 0.1);
        }

        .committee-title {
            font-family: var(--font-tech); color: var(--accent-gold);
            font-size: 1.2rem; letter-spacing: 1px; text-transform: uppercase;
            margin-bottom: 20px; border-bottom: 1px solid rgba(214, 194, 106, 0.3);
            padding-bottom: 10px; display: inline-block; width: 100%;
        }

        .member-list {
            list-style: none; display: flex; flex-direction: column; gap: 10px;
        }

        .member-item {
            font-size: 1.05rem; color: #fff; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 6px;
        }
        .member-item:last-child { border-bottom: none; }

        .role-badge {
            font-family: var(--font-tech); font-size: 0.75rem; background: rgba(77, 143, 72, 0.2);
            color: var(--accent-green); padding: 3px 8px; border-radius: 4px;
            border: 1px solid rgba(77, 143, 72, 0.4); text-transform: uppercase; letter-spacing: 0.5px;
        }

        /* Highlight Core Members differently */
        .role-convenor {
            background: rgba(214, 194, 106, 0.2); color: var(--accent-gold);
            border-color: rgba(214, 194, 106, 0.4);
        }

        @media (max-width: 768px) {
            .legacy-grid { grid-template-columns: 1fr; }
            .tab-btn { padding: 10px 20px; font-size: 0.9rem; }
            .brand { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <ishya-header></ishya-header>

    <canvas id="animated-bg"></canvas>
    <div id="bg-overlay"></div>

    <header class="page-header">
        <div class="brand">
            ISHYA LEGACY 
            <span>THE HALL OF FAME</span>
        </div>
    </header>

    <main>
        <section>
            <p class="intro-text">
                Honoring the dedicated minds, relentless visionaries, and creative forces who shaped our journey. Uniting for change, they ignited hope and amplified voices.
            </p>

            <div class="tabs">
                <button class="tab-btn active" data-year="25">Ishya '25</button>
                <button class="tab-btn" data-year="24">Ishya '24</button>
            </div>

            <div id="legacy-container" class="legacy-grid">
                <!-- Dynamically Populated by JS -->
            </div>
        </section>
    </main>

    <ishya-footer></ishya-footer>

    <script>
        // --- DATA STRUCTURE FOR PREVIOUS TEAMS ---
        const legacyData = {
            "25": [
                { name: "Core Leadership", members: [{name: "Gayathri Binu", role: "Convenor"}, {name: "Dheeraj R", role: "Co-Convenor"}, {name: "Sreerag N V", role: "Co-Convenor"}] },
                { name: "Advisory Committee", members: [{name: "Adithya Janardhanan"}, {name: "Justin Prasad"}, {name: "Swathi Sreeram"}] },
                { name: "Events Team", members: [{name: "Ajumiya Ashraf"}, {name: "Jyothirmayi"}, {name: "Dheeraj R"}, {name: "Rohit Mathew Titus"}] },
                { name: "PR & Outreach", members: [{name: "Adheena Lakshmi"}, {name: "J Devika"}, {name: "Gopika Krishna J"}] },
                { name: "Design Team", members: [{name: "Renuka Manoj"}, {name: "Meenakshy A S"}, {name: "Ananthika"}] },
                { name: "Social Media", members: [{name: "Jishon Prem"}, {name: "Rugma"}, {name: "Aswath Vinod M"}] },
                { name: "Content & Anchoring", members: [{name: "Shahnaz"}, {name: "Samyukta Anand"}, {name: "Adrija Basak"}, {name: "Ann Rose Saji"}] },
                { name: "Media Team", members: [{name: "Roshan"}, {name: "Olivia Maria John"}, {name: "Ameen Ahsan"}] },
                { name: "Website Team", members: [{name: "Eldho Sam Varghese"}, {name: "Aswath Vinod M"}, {name: "Nikhil Raju Manjooran"}, {name: "Neelay"}] },
                { name: "Finance Team", members: [{name: "Vibhavari"}, {name: "Roshida"}] },
                { name: "Sponsorship", members: [{name: "Raniya O C"}, {name: "Fathima Shirin"}] },
                { name: "Hospitality & Transport", members: [{name: "Nidhin Thomas"}, {name: "Thahliya"}, {name: "Navaneeth K"}, {name: "Adarsh A"}] },
                { name: "Production", members: [{name: "Yaswanth"}, {name: "Jefrin Saju"}, {name: "Devanarayanan"}] },
                { name: "ProShow & Crowd Mgmt", members: [{name: "Ajin"}, {name: "Vignesh"}] },
                { name: "Judges Management", members: [{name: "Anju K N"}, {name: "Siraj T M"}, {name: "Gowri S Nair"}, {name: "Devipriya A K"}] },
                { name: "Merchandise", members: [{name: "Hridya Hareesh"}, {name: "Gayathri K G"}, {name: "Niranjan K S"}] },
                { name: "Decoration", members: [{name: "Anju Aneesh"}, {name: "Anju Kamalam"}, {name: "Surya Raj"}, {name: "Nandhana"}] },
                { name: "Ishya Informals", members: [{name: "Aleena Sabu Koshy"}, {name: "Gowri S Ramesh"}, {name: "Avanthika Yadav"}] }
            ],
            "24": [
                { name: "Core Leadership", members: [{name: "Adithya Janardhanan", role: "Convenor"}, {name: "Justin Prasad", role: "Co-Convenor"}, {name: "Swathi Sreeram", role: "Co-Convenor"}] },
                { name: "Guidance", members: [{name: "Kaushik Babu"}, {name: "Joel J"}] },
                { name: "Events Team", members: [{name: "Shajiya Shahnas"}, {name: "Dheeraj Ramesh"}, {name: "Nayana"}, {name: "Abhimanyu"}] },
                { name: "PR & Outreach", members: [{name: "Adam Zacharia"}, {name: "Sreerag N V"}, {name: "Adheena Lakshmi"}] },
                { name: "Design Team", members: [{name: "Renuka"}, {name: "Meenakshy"}, {name: "Aardhra"}] },
                { name: "Social Media", members: [{name: "Aaqilah A J"}, {name: "Roshan"}, {name: "Anugreha"}] },
                { name: "Content", members: [{name: "Siraj T M"}, {name: "Fathima Thahliya"}] },
                { name: "Media Team", members: [{name: "Boney"}, {name: "Aivin C Thomas"}, {name: "Keerthana"}] },
                { name: "Anchoring", members: [{name: "Fathima Shirin"}, {name: "Mariya Joyson"}] },
                { name: "Website Team", members: [{name: "Adam Zacharia", role: "Lead Dev"}, {name: "Eldho", role: "Lead UI/UX"}, {name: "Aswath", role: "Lead UI/UX"}, {name: "Nikhil Raju", role: "Lead UI/UX"}] },
                { name: "Finance Team", members: [{name: "Jacob Cherry"}, {name: "Eswar Krishnan"}] },
                { name: "Sponsorship", members: [{name: "Rosha Dcruz"}, {name: "Raniya O C"}] },
                { name: "Hospitality", members: [{name: "Anjana Narayanan"}, {name: "Navaneeth K"}, {name: "Nitha Mohan"}] },
                { name: "Production", members: [{name: "Krishna S"}, {name: "Shwetha"}] },
                { name: "Transport", members: [{name: "Ashin Saj P"}] },
                { name: "Proshow Mgmt", members: [{name: "Athul V B"}] },
                { name: "Judges Management", members: [{name: "Ajin K Biju"}, {name: "Aaron Shibu"}, {name: "Anju Ann"}] },
                { name: "Merchandise", members: [{name: "Ahsana Aman"}, {name: "Navya P"}, {name: "Gayathri Binu"}] },
                { name: "Decoration", members: [{name: "Surya"}, {name: "Ajas M Khader"}, {name: "Akshay"}] }
            ]
        };

        // --- RENDER LOGIC ---
        const container = document.getElementById('legacy-container');
        const tabBtns = document.querySelectorAll('.tab-btn');

        function renderData(year) {
            container.classList.add('fade-out');
            
            setTimeout(() => {
                container.innerHTML = '';
                const data = legacyData[year];

                data.forEach(committee => {
                    const card = document.createElement('div');
                    card.className = 'committee-card';
                    
                    let membersHtml = '';
                    committee.members.forEach(member => {
                        let badgeHtml = '';
                        if(member.role) {
                            const badgeClass = member.role.toLowerCase().includes('convenor') ? 'role-badge role-convenor' : 'role-badge';
                            badgeHtml = `<span class="${badgeClass}">${member.role}</span>`;
                        }
                        membersHtml += `
                            <li class="member-item">
                                <span class="member-name">${member.name}</span>
                                ${badgeHtml}
                            </li>
                        `;
                    });

                    card.innerHTML = `
                        <h3 class="committee-title">${committee.name}</h3>
                        <ul class="member-list">
                            ${membersHtml}
                        </ul>
                    `;
                    container.appendChild(card);
                });

                container.classList.remove('fade-out');
            }, 300); // Wait for fade out
        }

        // Tab click listeners
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderData(btn.getAttribute('data-year'));
            });
        });

        // Initial Render
        renderData('25');

        // --- BACKGROUND ANIMATION ---
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('animated-bg');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height;

            const isMobile = window.innerWidth < 950;
            const COLORS = {
                bg: 'rgba(5, 20, 8, 1)',
                trail: 'rgba(5, 20, 8, 0.08)',
                swirlGreen: 'rgba(77, 183, 72, 0.2)',
                swirlDark: 'rgba(30, 50, 20, 0.3)',
                gold: 'rgba(214, 194, 106, 0.4)',
                mandala: 'rgba(214, 194, 106, 0.15)'
            };

            const particles = [];
            const numParticles = isMobile ? 30 : 400;
            const noiseScale = 0.002;
            let mandalas = [];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                ctx.fillStyle = COLORS.bg;
                ctx.fillRect(0, 0, width, height);

                mandalas = [
                    new Mandala(width, 0, width * 0.3, -0.002, COLORS.mandala),
                    new Mandala(0, height, width * 0.35, 0.0015, COLORS.mandala)
                ];

                if (particles.length === 0) {
                    for (let i = 0; i < numParticles; i++) particles.push(new FlowParticle());
                }
            }

            function noise(x, y) { return Math.sin(x) * Math.cos(y); }

            class FlowParticle {
                constructor() {
                    this.x = Math.random() * width; this.y = Math.random() * height;
                    this.speed = Math.random() * 2 + 0.5; this.angle = 0;
                    this.size = Math.random() * 2.5 + 0.5;
                    this.color = Math.random() > 0.9 ? COLORS.gold : (Math.random() > 0.6 ? COLORS.swirlGreen : COLORS.swirlDark);
                }
                update() {
                    const n = noise(this.x * noiseScale, this.y * noiseScale);
                    this.angle = n * Math.PI * 4;
                    this.x += Math.cos(this.angle) * this.speed; this.y += Math.sin(this.angle) * this.speed;
                    if (this.x < 0) this.x = width; if (this.x > width) this.x = 0;
                    if (this.y < 0) this.y = height; if (this.y > height) this.y = 0;
                }
                draw() {
                    ctx.fillStyle = this.color;
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
                }
            }

            class Mandala {
                constructor(x, y, radius, speed, color) {
                    this.x = x; this.y = y; this.radius = radius;
                    this.speed = speed; this.angle = 0; this.color = color;
                }
                update() { this.angle += this.speed; }
                draw() {
                    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle); ctx.strokeStyle = this.color;
                    if (isMobile) {
                        ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.stroke();
                        ctx.beginPath(); ctx.arc(0, 0, this.radius * 0.8, 0, Math.PI * 2); ctx.stroke();
                        ctx.beginPath(); ctx.arc(0, 0, this.radius * 0.6, 0, Math.PI * 2); ctx.stroke();
                    } else {
                        ctx.lineWidth = 1.5; const petals = 12;
                        for (let i = 0; i < petals; i++) {
                            ctx.rotate(Math.PI * 2 / petals);
                            ctx.beginPath(); ctx.moveTo(0, 0);
                            ctx.quadraticCurveTo(this.radius * 0.5, this.radius * 0.5, 0, this.radius);
                            ctx.quadraticCurveTo(-this.radius * 0.5, this.radius * 0.5, 0, 0); ctx.stroke();
                            ctx.beginPath(); ctx.arc(0, this.radius * 0.7, this.radius * 0.05, 0, Math.PI * 2);
                            ctx.fillStyle = COLORS.gold; ctx.fill();
                        }
                        ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.stroke();
                        ctx.beginPath(); ctx.arc(0, 0, this.radius * 0.9, 0, Math.PI * 2); ctx.stroke();
                    }
                    ctx.restore();
                }
            }

            function animate() {
                ctx.fillStyle = COLORS.trail; ctx.fillRect(0, 0, width, height);
                mandalas.forEach(m => { m.update(); m.draw(); });
                particles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', resize); resize(); animate();
        });
    </script>
</body>
</html>
