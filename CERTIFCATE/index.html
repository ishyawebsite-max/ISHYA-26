<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ISHYA '26 | Certificate Generator</title>

    <link rel="shortcut icon" type="image/x-icon" href="../Logo Ishya.ico" />
    <link rel="stylesheet" href="/global.css" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Foldit:wght@400;600;800;900&family=Syncopate:wght@400;700&family=Space+Grotesk:wght@300;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- PDF Generation Libraries -->
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <!-- Fontkit is REQUIRED to load custom cursive .ttf fonts into the PDF -->
    <script src="https://unpkg.com/@pdf-lib/fontkit/dist/fontkit.umd.min.js"></script>
    
    <script src="../layout.js" defer></script>

    <style>
        :root {
            --bg-dark: #051408;
            --accent-gold: #D6C26A;
            --accent-olive: #6B7540;
            --accent-green: #4D8F48;
            --text-light: #e0e0e0;
            --font-display: 'Syncopate', sans-serif;
            --font-fold: 'Foldit', display;
            --font-body: 'Space Grotesk', sans-serif;
            --font-tech: 'Share Tech Mono', monospace;
            --header-h: 75px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: transparent; color: var(--text-light);
            font-family: var(--font-body); overflow-x: hidden;
            width: 100vw; min-height: 100vh;
        }

        #animated-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -10;
            background-color: var(--bg-dark); pointer-events: none;
        }

        #bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(5, 20, 8, 0.9) 100%);
            z-index: -5; pointer-events: none;
        }

        section {
            min-height: calc(100vh - var(--header-h) - 100px);
            padding: 40px 5vw; display: flex; align-items: center; justify-content: center;
            z-index: 10; position: relative;
        }

        .section-layout {
            width: 100%; max-width: 1100px; display: flex; align-items: center; 
            justify-content: space-between; gap: 60px;
        }

        .perch-zone { width: 45%; }
        .content-zone { width: 55%; }

        .perch-title {
            font-family: var(--font-fold), var(--font-display), sans-serif;
            font-size: clamp(3rem, 5vw, 4.5rem); color: var(--accent-gold);
            line-height: 1; margin-bottom: 12px; text-shadow: 0 0 24px rgba(0, 0, 0, 0.8);
        }

        .perch-subtitle {
            font-family: var(--font-tech); font-size: 0.9rem; letter-spacing: 2px;
            padding: 6px 12px; display: inline-block; background: rgba(0,0,0,0.5); 
            border: 1px solid var(--accent-olive); color: var(--accent-green); 
            text-transform: uppercase; margin-bottom: 20px;
        }

        .perch-body { font-size: 1.05rem; line-height: 1.7; color: rgba(240,240,240,0.9); }

        .form-wrapper {
            border-radius: 24px; border: 1px solid rgba(148, 163, 184, 0.3);
            background: radial-gradient(circle at top left, rgba(148, 163, 184, 0.15), rgba(5, 10, 8, 0.96));
            padding: 40px; box-shadow: 0 18px 40px rgba(0,0,0,0.8); backdrop-filter: blur(10px);
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
        .input-group label {
            font-family: var(--font-tech); color: var(--accent-gold);
            font-size: 0.95rem; letter-spacing: 1px; text-transform: uppercase;
        }

        .custom-input {
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(148, 163, 184, 0.4);
            padding: 14px 18px; border-radius: 8px; color: #fff;
            font-family: var(--font-body); font-size: 1.1rem; outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .custom-input:focus {
            border-color: var(--accent-green); box-shadow: 0 0 12px rgba(77, 143, 72, 0.3);
        }

        .custom-input option { background: #051408; color: #fff; }

        .btn-generate {
            width: 100%; background: var(--accent-green); color: #fff;
            border: none; padding: 16px 24px; border-radius: 8px;
            font-family: var(--font-display); font-size: 1rem; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2px;
            transition: all 0.3s ease; font-weight: bold;
        }

        .btn-generate:hover:not(:disabled) {
            background: var(--accent-gold); color: #051408; transform: translateY(-2px);
        }
        .btn-generate:disabled { opacity: 0.6; cursor: not-allowed; }

        .status-message {
            margin-top: 16px; font-family: var(--font-tech); font-size: 0.9rem; text-align: center;
            min-height: 20px; transition: color 0.3s;
        }
        .status-error { color: #ff6b6b; }
        .status-success { color: var(--accent-green); }
        .status-loading { color: var(--accent-gold); }

        @media (max-width: 950px) {
            .section-layout { flex-direction: column; text-align: center; }
            .perch-zone, .content-zone { width: 100%; }
            .form-wrapper { padding: 30px 20px; text-align: left; }
        }
    </style>
</head>
<body>
    <ishya-header></ishya-header>

    <canvas id="animated-bg"></canvas>
    <div id="bg-overlay"></div>

    <header style="position: relative; width: 100%; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 40px 20px 10px 20px;">
        <div class="brand" style="font-size: 2.2rem; font-weight: 700; color: var(--accent-gold); letter-spacing: 2px; text-transform: uppercase; text-align: center; line-height: 1;">
            ISHYA '26 <span style="color: var(--accent-green); font-size: 1rem; display: block; letter-spacing: 6px; margin-top: 5px;">CERTIFICATES</span>
        </div>
    </header>

    <main>
        <section>
            <div class="section-layout">
                <div class="perch-zone">
                    <h1 class="perch-title">CLAIM YOUR GLORY</h1>
                    <div class="perch-subtitle">Official Documentation</div>
                    <p class="perch-body">
                        Enter the mobile number used during registration. If you participated as a team, our system will automatically detect your squad and generate a single PDF containing all members' certificates.
                    </p>
                </div>
                
                <div class="content-zone">
                    <div class="form-wrapper">
                        <div class="input-group">
                            <label for="event-select">Select Event</label>
                            <select id="event-select" class="custom-input">
                                <option value="" disabled selected>Loading events...</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label for="mobile-input">Registered Mobile Number</label>
                            <input type="tel" id="mobile-input" class="custom-input" placeholder="e.g. 9876543210">
                        </div>

                        <button id="generate-btn" class="btn-generate">Generate Certificate</button>
                        <div id="status-text" class="status-message"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <ishya-footer></ishya-footer>

    <script>
        // --- 1. CONFIGURATION ---
        const API_URL = "https://script.google.com/macros/s/AKfycbza4TAAB8azPA5-4hJdM1BJi_Q1irwyJMbPtrCEDxwbyHUOY2m6mqwRZX1_2zJfzjGj/exec"; 
        const TEMPLATE_URL = "./T.pdf"; 
        
        // This is a beautiful Cursive Script font from Google Fonts (Great Vibes)
        const CURSIVE_FONT_URL = "https://fonts.gstatic.com/s/greatvibes/v14/RWmMoKWR9v4ksMfaWd_JN9XliaO6.ttf";

        const eventSelect = document.getElementById('event-select');
        const generateBtn = document.getElementById('generate-btn');
        const statusEl = document.getElementById('status-text');

        // --- 2. FETCH DYNAMIC EVENTS ON LOAD ---
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch(`${API_URL}?action=getEvents`);
                const rawText = await res.text(); 
                
                try {
                    const json = JSON.parse(rawText);
                    if (json.status === "success" && json.data) {
                        eventSelect.innerHTML = '<option value="" disabled selected>-- Choose your event --</option>';
                        json.data.forEach(eventName => {
                            const opt = document.createElement('option');
                            opt.value = eventName;
                            opt.innerText = eventName;
                            eventSelect.appendChild(opt);
                        });
                    } else {
                        eventSelect.innerHTML = `<option value="" disabled>Error: ${json.message}</option>`;
                    }
                } catch (parseError) {
                    eventSelect.innerHTML = '<option value="" disabled>Script Error (Check Console)</option>';
                }
            } catch (err) {
                eventSelect.innerHTML = '<option value="" disabled>Network Error (Check Console)</option>';
            }
        });

        // --- 3. GENERATE PDF LOGIC ---
        generateBtn.addEventListener('click', async () => {
            const eventName = eventSelect.value;
            const mobile = document.getElementById('mobile-input').value.trim();

            if(!eventName || !mobile) {
                setStatus("Please select an event and enter your mobile number.", "error");
                return;
            }

            setStatus("Searching database...", "loading");
            generateBtn.disabled = true;

            try {
                // Fetch User Data
                const res = await fetch(`${API_URL}?action=getCertificates&event=${encodeURIComponent(eventName)}&mobile=${encodeURIComponent(mobile)}`);
                const rawText = await res.text();
                
                let result;
                try { result = JSON.parse(rawText); } 
                catch(e) { throw new Error("Server configuration error."); }

                if(result.status !== 'success') {
                    throw new Error(result.message || "Record not found. Check your details.");
                }

                const participants = result.data; 
                setStatus(`Found ${participants.length} record(s). Downloading Template & Fonts...`, "loading");

                // Fetch PDF Template
                const pdfResponse = await fetch(TEMPLATE_URL);
                if (!pdfResponse.ok) throw new Error(`Failed to load PDF template.`);
                const existingPdfBytes = await pdfResponse.arrayBuffer();

                // Fetch Custom Cursive Font
                const fontResponse = await fetch(CURSIVE_FONT_URL);
                if (!fontResponse.ok) throw new Error("Failed to load cursive font.");
                const customFontBytes = await fontResponse.arrayBuffer();

                setStatus(`Designing Certificate...`, "loading");

                // Initialize PDF creation
                const { PDFDocument, rgb, StandardFonts } = PDFLib;
                const finalPdf = await PDFDocument.create();
                
                // Register Fontkit (Required for custom .ttf fonts)
                finalPdf.registerFontkit(window.fontkit);
                
                // Embed Fonts
                const cursiveFont = await finalPdf.embedFont(customFontBytes); 
                const boldSerifFont = await finalPdf.embedFont(StandardFonts.TimesRomanBoldItalic); // For Event Name
                const regularFont = await finalPdf.embedFont(StandardFonts.Helvetica); // For "securing position in"
                
                // Colors
                const goldColor = rgb(0.85, 0.77, 0.50); // Muted gold matching your template
                const whiteColor = rgb(0.9, 0.9, 0.9);

                // Load Template Once
                const templateDoc = await PDFDocument.load(existingPdfBytes);

                // Process each team member
                for (let person of participants) {
                    
                    const [copiedPage] = await finalPdf.copyPages(templateDoc, [0]);
                    const page = finalPdf.addPage(copiedPage); 
                    const { width, height } = page.getSize();

                    // --- A. DETERMINE GRAMMAR ---
                    let posText = person.position ? person.position.toLowerCase() : "participant";
                    let actionText = "for participating in";
                    
                    if (posText && posText !== "participant") {
                        if (posText.includes("winner") || posText.includes("runner")) {
                            actionText = `for emerging as the ${person.position} in`;
                        } else {
                            actionText = `for bagging ${person.position} Position in`;
                        }
                    }

                    // --- B. AUTO-SCALING THE NAME & CALCULATING POSITIONS ---
                    // "proudly presented to" is just above midline. We will place text exactly beneath it.
                    
                    // 1. Draw Cursive Name
                    let nameFontSize = 64; 
                    let nameWidth = cursiveFont.widthOfTextAtSize(person.name, nameFontSize);
                    
                    // Shrink font if name is too long for the page!
                    while (nameWidth > width - 120) {
                        nameFontSize -= 2;
                        nameWidth = cursiveFont.widthOfTextAtSize(person.name, nameFontSize);
                    }
                    
                    page.drawText(person.name, {
                        x: (width - nameWidth) / 2,
                        y: height / 2 - 25, 
                        size: nameFontSize,
                        font: cursiveFont,
                        color: goldColor
                    });

                    // 2. Draw Action Text ("for bagging 1st Position in")
                    const actionFontSize = 16;
                    const actionWidth = regularFont.widthOfTextAtSize(actionText, actionFontSize);
                    page.drawText(actionText, {
                        x: (width - actionWidth) / 2,
                        y: height / 2 - 65,
                        size: actionFontSize,
                        font: regularFont,
                        color: whiteColor
                    });

                    // 3. Draw Event Name (Bold Serif)
                    let eventFontSize = 32;
                    let eventWidth = boldSerifFont.widthOfTextAtSize(eventName.toUpperCase(), eventFontSize);
                    
                    // Shrink event font if it's too long
                    while (eventWidth > width - 120) {
                        eventFontSize -= 2;
                        eventWidth = boldSerifFont.widthOfTextAtSize(eventName.toUpperCase(), eventFontSize);
                    }

                    page.drawText(eventName.toUpperCase(), {
                        x: (width - eventWidth) / 2,
                        y: height / 2 - 110,
                        size: eventFontSize,
                        font: boldSerifFont,
                        color: goldColor
                    });
                }

                // Download Final PDF
                const pdfBytes = await finalPdf.save();
                const blob = new Blob([pdfBytes], { type: "application/pdf" });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `${eventName}_Certificate.pdf`;
                link.click();

                setStatus("Certificate generated successfully!", "success");

            } catch (error) {
                setStatus(error.message, "error");
            } finally {
                generateBtn.disabled = false;
            }
        });

        // Helper to update UI text
        function setStatus(text, type) {
            statusEl.innerText = text;
            statusEl.className = `status-message status-${type}`;
        }

        // --- BACKGROUND ANIMATION ---
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('animated-bg');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height;

            const isMobile = window.innerWidth < 950;
            const COLORS = {
                bg: 'rgba(5, 20, 8, 1)',
                trail: 'rgba(5, 20, 8, 0.08)',
                swirlGreen: 'rgba(77, 183, 72, 0.2)',
                swirlDark: 'rgba(30, 50, 20, 0.3)',
                gold: 'rgba(214, 194, 106, 0.4)',
                mandala: 'rgba(214, 194, 106, 0.15)'
            };

            const particles = [];
            const numParticles = isMobile ? 30 : 400;
            const noiseScale = 0.002;
            let mandalas = [];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                ctx.fillStyle = COLORS.bg;
                ctx.fillRect(0, 0, width, height);

                mandalas = [
                    new Mandala(width, 0, width * 0.3, -0.002, COLORS.mandala),
                    new Mandala(0, height, width * 0.35, 0.0015, COLORS.mandala)
                ];

                if (particles.length === 0) {
                    for (let i = 0; i < numParticles; i++) particles.push(new FlowParticle());
                }
            }

            function noise(x, y) { return Math.sin(x) * Math.cos(y); }

            class FlowParticle {
                constructor() {
                    this.x = Math.random() * width; this.y = Math.random() * height;
                    this.speed = Math.random() * 2 + 0.5; this.angle = 0;
                    this.size = Math.random() * 2.5 + 0.5;
                    this.color = Math.random() > 0.9 ? COLORS.gold : (Math.random() > 0.6 ? COLORS.swirlGreen : COLORS.swirlDark);
                }
                update() {
                    const n = noise(this.x * noiseScale, this.y * noiseScale);
                    this.angle = n * Math.PI * 4;
                    this.x += Math.cos(this.angle) * this.speed; this.y += Math.sin(this.angle) * this.speed;
                    if (this.x < 0) this.x = width; if (this.x > width) this.x = 0;
                    if (this.y < 0) this.y = height; if (this.y > height) this.y = 0;
                }
                draw() {
                    ctx.fillStyle = this.color;
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
                }
            }

            class Mandala {
                constructor(x, y, radius, speed, color) {
                    this.x = x; this.y = y; this.radius = radius;
                    this.speed = speed; this.angle = 0; this.color = color;
                }
                update() { this.angle += this.speed; }
                draw() {
                    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle); ctx.strokeStyle = this.color;
                    if (isMobile) {
                        ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.stroke();
                        ctx.beginPath(); ctx.arc(0, 0, this.radius * 0.8, 0, Math.PI * 2); ctx.stroke();
                        ctx.beginPath(); ctx.arc(0, 0, this.radius * 0.6, 0, Math.PI * 2); ctx.stroke();
                    } else {
                        ctx.lineWidth = 1.5; const petals = 12;
                        for (let i = 0; i < petals; i++) {
                            ctx.rotate(Math.PI * 2 / petals);
                            ctx.beginPath(); ctx.moveTo(0, 0);
                            ctx.quadraticCurveTo(this.radius * 0.5, this.radius * 0.5, 0, this.radius);
                            ctx.quadraticCurveTo(-this.radius * 0.5, this.radius * 0.5, 0, 0); ctx.stroke();
                            ctx.beginPath(); ctx.arc(0, this.radius * 0.7, this.radius * 0.05, 0, Math.PI * 2);
                            ctx.fillStyle = COLORS.gold; ctx.fill();
                        }
                        ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.stroke();
                        ctx.beginPath(); ctx.arc(0, 0, this.radius * 0.9, 0, Math.PI * 2); ctx.stroke();
                    }
                    ctx.restore();
                }
            }

            function animate() {
                ctx.fillStyle = COLORS.trail; ctx.fillRect(0, 0, width, height);
                mandalas.forEach(m => { m.update(); m.draw(); });
                particles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', resize); resize(); animate();
        });
    </script>
</body>
</html>
